[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blocked-by"
version = "1.0.0"
description = "Quote the single eligibility clause that excludes a patient."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Choppa Devasai Pranatheswar" }]
dependencies = []

[project.scripts]
blocked-by = "blocked_by.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
